[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Keep files in date order: 20261106_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
