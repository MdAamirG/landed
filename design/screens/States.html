<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>States</title>
<meta name="description" content="States: proof-of-delivery capture and billing for a truck fleet">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+Devanagari:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Hallmark · v2.0.0 · theme: coral (dealt 1/3, seed proof-of-delivery-capture-billing-app-11b3 r0) · shape: app screen · genre: modern-minimal · posture: restrained · nav: top bar · footer: none · signature: the review desk, the photo beside what the AI read · swap: General Sans to Instrument Sans, the canvas loads Google Fonts only */
/* critique: top bar, not a sidebar, for four destinations; tables before cards; coral only on the pressed settled state, link underlines and focus */
/* colour note: the brief asks for a clear success and retake colour for low-literacy drivers, so the phone keeps green for done and ochre for retake; coral reads as an error at a gate */
:root{--color-paper:oklch(97% 0.006 55);--color-paper-2:oklch(94.5% 0.007 55);--color-paper-3:oklch(91.5% 0.009 55);--color-ink:oklch(21% 0.012 38);--color-ink-2:oklch(29% 0.013 40);--color-muted:oklch(47% 0.013 45);--color-rule:oklch(87% 0.009 55);--color-rule-2:oklch(81% 0.011 55);--color-accent:oklch(74% 0.125 30);--color-accent-2:oklch(54% 0.165 29);--color-focus:oklch(54% 0.17 30);--color-cotton:oklch(98.8% 0.0045 80);--color-desk:oklch(94.3% 0.008 64);--color-print:oklch(23% 0.012 38);--color-board:oklch(22% 0.011 40);--color-board-type:oklch(96.5% 0.006 70);--color-board-muted:oklch(80% 0.01 60);--color-paid:oklch(55.5% 0.15 33);--color-accent-ink:oklch(21% 0.012 38);--color-ok:oklch(50% 0.11 150);--color-ok-wash:oklch(93.5% 0.035 150);--color-retake:oklch(62% 0.13 70);--color-retake-ink:oklch(41% 0.09 62);--color-retake-wash:oklch(94% 0.045 80);--color-plate:oklch(87% 0.14 92);--color-stamp:oklch(45% 0.09 290);--color-board-rule:oklch(96.5% 0.006 70 / 0.18);--shade:32% 0.03 50;--lit:100% 0.005 80;--deep:7% 0.01 40;--font-display:"Instrument Sans","Noto Sans Devanagari",ui-sans-serif,system-ui,sans-serif;--font-body:var(--font-display);--font-outlier:"Geist Mono",ui-monospace,monospace;--radius-stock:8px;--radius-input:6px;--edge-stock:inset 0 1px 0 oklch(var(--lit) / 0.9),inset 0 -1px 0 oklch(var(--shade) / 0.07),0 0 0 0.5px oklch(var(--shade) / 0.22),0 1px 0 oklch(var(--shade) / 0.12);--cast-stock:6px 5px 10px -6px oklch(var(--shade) / 0.3);--cast-stock-lift:12px 10px 18px -8px oklch(var(--shade) / 0.3);--cast-deep:14px 16px 30px -12px oklch(var(--deep) / 0.7);--press-groove:inset 1px 1.5px 2px oklch(var(--shade) / 0.16),inset -1px -1px 0 oklch(var(--lit) / 0.9),0 0 0 0.5px oklch(var(--shade) / 0.2);--tracking-display:-0.03em}
html,body{overflow-x:clip}body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:var(--tracking-display);line-height:1.08;margin:0;overflow-wrap:break-word;min-width:0;text-wrap:balance}::selection{background-color:var(--color-accent);color:var(--color-accent-ink,var(--color-ink))}html{scrollbar-color:var(--color-rule-2) var(--color-paper);caret-color:var(--color-focus)}p{margin:0}button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}.fig{font-family:var(--font-outlier);font-variant-numeric:tabular-nums}.muted{color:var(--color-muted)}.stock{background-color:var(--color-cotton);background-image:linear-gradient(100deg,var(--color-cotton),oklch(var(--shade) / 0.03));color:var(--color-print);box-shadow:var(--edge-stock),var(--cast-stock);border-radius:var(--radius-stock)}.desk{background-color:var(--color-desk);background-image:radial-gradient(90% 120% at 0% 30%,var(--color-cotton),transparent 62%)}.btn{min-height:40px;padding:0 16px;border:0;border-radius:var(--radius-stock);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform 120ms ease-out,box-shadow 120ms ease-out}.btn--card{background-color:var(--color-cotton);color:var(--color-print);text-shadow:0.5px 0.75px 0 var(--color-cotton);box-shadow:var(--edge-stock),var(--cast-stock)}.btn--ink{background-color:var(--color-board);color:var(--color-board-type);text-shadow:0 -0.75px 0 var(--color-ink);box-shadow:var(--cast-stock)}.btn:hover{transform:translateY(-1px);box-shadow:var(--edge-stock),var(--cast-stock-lift)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.settled{display:inline-block;font-weight:600;color:var(--color-paid);text-shadow:0.5px 0.75px 0 var(--color-cotton),-0.5px -0.5px 0 oklch(var(--shade) / 0.25)}.tag{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px;border:1px solid var(--color-rule-2);border-radius:6px;font-size:13px;font-weight:500;color:var(--color-ink-2);white-space:nowrap}.groove{display:inline-flex;padding:4px;gap:2px;border-radius:12px;background-color:var(--color-paper-2);box-shadow:var(--press-groove)}.groove button{border:0;background:transparent;min-height:36px;padding:0 16px;border-radius:8px;font-weight:500;color:var(--color-muted);cursor:pointer}.groove button[aria-pressed="true"]{background-color:var(--color-cotton);color:var(--color-print);box-shadow:var(--edge-stock),var(--cast-stock)}a{color:var(--color-ink);text-decoration-color:var(--color-accent);text-underline-offset:3px}a:hover{text-decoration-color:var(--color-accent-2)}@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover,.btn:active{transform:none}}
.top{min-height:60px;display:flex;align-items:center;gap:28px;padding:0 28px;border-bottom:1px solid var(--color-rule);background-color:var(--color-paper)}.word{font-weight:600;font-size:19px;letter-spacing:-0.02em;text-decoration:none;color:var(--color-ink)}.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}.nav a{min-height:60px;display:flex;align-items:center;gap:8px;padding:0 12px;text-decoration:none;color:var(--color-muted);font-weight:500;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}.nav a[aria-current="page"]{color:var(--color-ink);border-bottom-color:var(--color-ink)}.count{font-family:var(--font-outlier);font-size:12px;color:var(--color-muted)}.who{display:flex;align-items:center;gap:16px;font-size:14px;color:var(--color-muted)}.wrap{max-width:1360px;margin:0 auto;padding:28px}.head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:24px}.head h1{font-size:28px}.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th{text-align:left;font-weight:500;font-size:13px;color:var(--color-muted);padding:0 12px 12px;border-bottom:1px solid var(--color-rule-2)}.tbl td{padding:12px;border-bottom:1px solid var(--color-rule);vertical-align:middle}.tbl .r{text-align:right}.scroll{overflow-x:auto}.small{font-size:13px}.btn--sm{min-height:32px;padding:0 12px;font-size:14px}@media (max-width:60rem){.top{gap:12px;padding:0 16px}.wrap{padding:20px 16px}.who span{display:none}}@media (max-width:60rem){.sg{grid-template-columns:minmax(0,1fr) !important}}
</style>
<main class="wrap" style="max-width: 1360px">
<div class="sg" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px">
<section aria-label="Loading state"><h2 style="font-size: 16px; color: var(--color-muted); font-weight: 500; letter-spacing: 0">Loading</h2>
<div style="border-top: 1px solid var(--color-rule); margin-top: 12px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--color-rule)"><span style="display: block; height: 12px; width: 42%; border-radius: 4px; background-color: var(--color-paper-3)"></span><span style="display: block; height: 12px; width: 68%; border-radius: 4px; background-color: var(--color-paper-3)"></span><span style="display: block; height: 12px; width: 30%; border-radius: 4px; background-color: var(--color-paper-3)"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--color-rule)"><span style="display: block; height: 12px; width: 38%; border-radius: 4px; background-color: var(--color-paper-3)"></span><span style="display: block; height: 12px; width: 60%; border-radius: 4px; background-color: var(--color-paper-3)"></span><span style="display: block; height: 12px; width: 26%; border-radius: 4px; background-color: var(--color-paper-3)"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--color-rule)"><span style="display: block; height: 12px; width: 45%; border-radius: 4px; background-color: var(--color-paper-3)"></span><span style="display: block; height: 12px; width: 64%; border-radius: 4px; background-color: var(--color-paper-3)"></span><span style="display: block; height: 12px; width: 34%; border-radius: 4px; background-color: var(--color-paper-3)"></span></div>
</div><p class="muted" style="font-size: 13px; margin-top: 12px">Rows in the shape of the queue, so nothing jumps when data lands.</p></section>
<section aria-label="Empty state"><h2 style="font-size: 16px; color: var(--color-muted); font-weight: 500; letter-spacing: 0">Empty</h2>
<div style="border-top: 1px solid var(--color-rule); margin-top: 12px; padding: 48px 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
<h3 style="font-size: 22px">Nothing to review</h3>
<p class="muted">PODs with a shortage, damage or an unsure read land here.</p>
<button class="btn btn--card">Go to billing</button>
</div></section>
<section aria-label="Error state"><h2 style="font-size: 16px; color: var(--color-muted); font-weight: 500; letter-spacing: 0">Error</h2>
<div style="border-top: 1px solid var(--color-rule); margin-top: 12px; padding: 48px 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
<span style="color: var(--color-retake-ink); display: flex"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17H2.5z"/><path d="M12 10v4M12 17.5v.01"/></svg></span>
<h3 style="font-size: 22px">The AI check did not answer</h3>
<p class="muted">The photo is saved and waiting here for a person, so billing is not held up.</p>
<button class="btn btn--ink">Run the check again</button>
</div></section>
</div>
</main>
</body>
</html>
