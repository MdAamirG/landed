<style>

:root{--color-paper:oklch(97% 0.006 55);--color-paper-2:oklch(94.5% 0.007 55);--color-paper-3:oklch(91.5% 0.009 55);--color-ink:oklch(21% 0.012 38);--color-ink-2:oklch(29% 0.013 40);--color-muted:oklch(47% 0.013 45);--color-rule:oklch(87% 0.009 55);--color-rule-2:oklch(81% 0.011 55);--color-accent:oklch(74% 0.125 30);--color-accent-2:oklch(54% 0.165 29);--color-focus:oklch(54% 0.17 30);--color-cotton:oklch(98.8% 0.0045 80);--color-desk:oklch(94.3% 0.008 64);--color-print:oklch(23% 0.012 38);--color-board:oklch(22% 0.011 40);--color-board-type:oklch(96.5% 0.006 70);--color-board-muted:oklch(80% 0.01 60);--color-paid:oklch(55.5% 0.15 33);--color-accent-ink:oklch(21% 0.012 38);--color-ok:oklch(50% 0.11 150);--color-ok-wash:oklch(93.5% 0.035 150);--color-retake:oklch(62% 0.13 70);--color-retake-ink:oklch(41% 0.09 62);--color-retake-wash:oklch(94% 0.045 80);--color-plate:oklch(87% 0.14 92);--color-stamp:oklch(45% 0.09 290);--color-board-rule:oklch(96.5% 0.006 70 / 0.18);--shade:32% 0.03 50;--lit:100% 0.005 80;--deep:7% 0.01 40;--font-display:"Instrument Sans","Noto Sans Devanagari",ui-sans-serif,system-ui,sans-serif;--font-body:var(--font-display);--font-outlier:"Geist Mono",ui-monospace,monospace;--radius-stock:8px;--radius-input:6px;--edge-stock:inset 0 1px 0 oklch(var(--lit) / 0.9),inset 0 -1px 0 oklch(var(--shade) / 0.07),0 0 0 0.5px oklch(var(--shade) / 0.22),0 1px 0 oklch(var(--shade) / 0.12);--cast-stock:6px 5px 10px -6px oklch(var(--shade) / 0.3);--cast-stock-lift:12px 10px 18px -8px oklch(var(--shade) / 0.3);--cast-deep:14px 16px 30px -12px oklch(var(--deep) / 0.7);--press-groove:inset 1px 1.5px 2px oklch(var(--shade) / 0.16),inset -1px -1px 0 oklch(var(--lit) / 0.9),0 0 0 0.5px oklch(var(--shade) / 0.2);--tracking-display:-0.03em}
html,body{overflow-x:clip}body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:var(--tracking-display);line-height:1.08;margin:0;overflow-wrap:break-word;min-width:0;text-wrap:balance}::selection{background-color:var(--color-accent);color:var(--color-accent-ink,var(--color-ink))}html{scrollbar-color:var(--color-rule-2) var(--color-paper);caret-color:var(--color-focus)}p{margin:0}button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}.fig{font-family:var(--font-outlier);font-variant-numeric:tabular-nums}.muted{color:var(--color-muted)}.stock{background-color:var(--color-cotton);background-image:linear-gradient(100deg,var(--color-cotton),oklch(var(--shade) / 0.03));color:var(--color-print);box-shadow:var(--edge-stock),var(--cast-stock);border-radius:var(--radius-stock)}.desk{background-color:var(--color-desk);background-image:radial-gradient(90% 120% at 0% 30%,var(--color-cotton),transparent 62%)}.btn{min-height:40px;padding:0 16px;border:0;border-radius:var(--radius-stock);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform 120ms ease-out,box-shadow 120ms ease-out}.btn--card{background-color:var(--color-cotton);color:var(--color-print);text-shadow:0.5px 0.75px 0 var(--color-cotton);box-shadow:var(--edge-stock),var(--cast-stock)}.btn--ink{background-color:var(--color-board);color:var(--color-board-type);text-shadow:0 -0.75px 0 var(--color-ink);box-shadow:var(--cast-stock)}.btn:hover{transform:translateY(-1px);box-shadow:var(--edge-stock),var(--cast-stock-lift)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.settled{display:inline-block;font-weight:600;color:var(--col .ph{width:390px;height:780px;display:flex;flex-direction:column;position:relative;overflow:hidden}.big{width:100%;border-radius:14px;flex-direction:column}.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}.dl dt{font-size:13px;color:var(--color-muted)}.dl dd{margin:0;font-family:var(--font-outlier);font-size:15px;color:var(--color-print)}.sheet{position:absolute;left:0;right:0;bottom:0;background-color:var(--color-cotton);border-radius:16px 16px 0 0;padding:24px 20px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 -1px 0 oklch(var(--lit) / 0.6)}.cam-top{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;align-items:center;color:var(--color-board-type);font-size:14px}.rec{position:absolute;left:58px;top:70px;width:274px;height:296px;transform:rotate(-1.5deg);padding:20px;box-shadow:var(--edge-stock),var(--cast-deep)}.line{height:2px;background-color:var(--color-rule);margin-top:12px;border-radius:1px}.step{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:500}.ico{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}

<div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center"><p style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--color-muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M8.5 8.6A5 5 0 004 13.5 4.5 4.5 0 008.5 18H17m3.2-1.7A4 4 0 0017 10a6 6 0 00-6.2-4.9"/></svg>No network</p><button class="btn btn--card" style="width: 48px; height: 48px; padding: 0" aria-label="Play voice message"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button></div>
<div style="width: 128px; height: 128px; border-radius: 64px; background-color: var(--color-paper-3); color: var(--color-ink); display: flex; align-items: center; justify-content: center; margin-top: 26px"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10.5 18.5h3"/><path d="M12 7v6M9.5 10.5L12 13l2.5-2.5"/></svg></div>
<h1 style="font-size: 30px; margin-top: 22px; text-align: center">फोटो फ़ोन में सेव है</h1>
<p class="muted" style="font-size: 16px; margin-top: 6px; text-align: center">Saved on the phone. It sends by itself when the network is back.</p>
<div class="stock" style="width: 100%; margin-top: 26px; padding: 14px; display: flex; gap: 12px; align-items: center">
<div style="width: 44px; height: 56px; border-radius: 4px; background-color: var(--color-paper-2); box-shadow: var(--edge-stock); flex: none"></div>
<div style="flex: 1"><p style="font-weight: 600"><span class="fig" style="font-weight: 500">TRP-66141</span>, Indore</p><p class="muted" style="font-size: 13px"><span class="fig">214 KB</span>, waiting for network</p></div>

<p style="align-self: stretch; display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 0 4px; font-size: 14px; font-weight: 500; color: var(--color-ok)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>The phone checked it: sharp and bright enough</p>
